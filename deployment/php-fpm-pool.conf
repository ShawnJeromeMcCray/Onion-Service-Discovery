[onion-service-discovery]
user = osd-worker
group = osd
listen = /run/php/onion-service-discovery.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 200
clear_env = yes
catch_workers_output = no
request_terminate_timeout = 65s
; No core dumps: worker memory holds request data.
rlimit_core = 0
; The web server passes every request to index.php; run no other script type.
security.limit_extensions = .php
php_admin_value[memory_limit] = 128M
; CPU seconds on Linux; request_terminate_timeout above bounds the wall time.
php_admin_value[max_execution_time] = 30
; PHP's own form parsing ($_POST) stops at this size. OSD reads the raw body with
; its own caps (256 bytes for announcements); the web server templates admit 1 KiB.
; Server search takes up to 8 KiB: use the separate search pool.
php_admin_value[post_max_size] = 1K
php_admin_flag[file_uploads] = off
; OSD makes outbound requests only through curl and the Tor SOCKS listener and
; never opens URLs as files.
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = off
php_admin_value[expose_php] = Off
