# Development deployment reference for Apache httpd 2.4 with mod_proxy_fcgi.
# Equivalent to deployment/nginx/onion-service-discovery.conf. Replace paths/socket
# for the supported host. The Onion Service forwards to this loopback listener;
# do not expose it on WAN. Enable: a2enmod proxy proxy_fcgi reqtimeout
# To add OSD to an existing website instead, see existing-site-locations.conf.example.
# ServerTokens is a global directive and cannot be set here: put "ServerTokens Prod"
# in the main configuration (Debian/Ubuntu: conf-available/security.conf).
Listen 127.0.0.1:8080
<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    DocumentRoot /opt/onion-service-discovery/node-php/public
    # No access log: request paths can reveal what visitors look at.
    ErrorLog ${APACHE_LOG_DIR}/onion-service-discovery-error.log
    LogLevel crit
    ServerSignature Off
    TraceEnable off
    # Header limits. This is the only (so the default) virtual host on this
    # listener, which is where Apache takes these values from. OSD request targets
    # are short (the data API refuses targets over 256 bytes) and OSD sets no cookies.
    LimitRequestLine 4094
    LimitRequestFieldSize 4094
    LimitRequestFields 50
    LimitRequestBody 1024
    RequestReadTimeout header=5 body=5
    KeepAliveTimeout 10
    ProxyTimeout 65
    <Directory /opt/onion-service-discovery/node-php/public>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    # Only the front controller is executable. Every request, including the
    # Well-Known Manifest, goes through it; no directory listing or other PHP.
    # LimitRequestBody is not reliably enforced for proxied FastCGI requests (tested
    # with httpd 2.4.58): refuse oversized or chunked bodies before they reach PHP.
    # The NoJS search profile needs its own reviewed larger limit; see server-search.md.
    <If "%{HTTP:Content-Length} -gt 1024 || -n %{HTTP:Transfer-Encoding}">
        Require all denied
    </If>
    SetEnv ONION_SERVICE_DISCOVERY_CONFIG /etc/onion-service-discovery/node.json
    ProxyPassMatch "^/.*$" "unix:/run/php/onion-service-discovery.sock|fcgi://localhost/opt/onion-service-discovery/node-php/public/index.php"
</VirtualHost>
