# Development deployment reference. Replace paths/socket for the supported host.
# The Onion Service forwards to this loopback listener; do not expose it on WAN.
# To add OSD to an existing website instead, see existing-site-locations.conf.example.
server {
    listen 127.0.0.1:8080;
    # Tor passes your Onion as the Host header. This is the only server on the
    # listener, so it answers every Host. OSD never routes on Host: the Manifest's
    # Onion comes from the configuration. To refuse other Host values, set
    # server_name to your Onion and add a default_server here that returns 444.
    server_name _;
    root /opt/onion-service-discovery/node-php/public;
    # No version in the Server header or in nginx error pages.
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/onion-service-discovery-error.log crit;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    # The request line and each header must fit in 4 KiB. OSD request targets are
    # short (the data API refuses targets over 256 bytes) and OSD sets no cookies.
    large_client_header_buffers 4 4k;
    keepalive_timeout 10s;
    # Only the front controller is executable. No directory listing or other PHP.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/onion-service-discovery/node-php/public/index.php;
        fastcgi_param ONION_SERVICE_DISCOVERY_CONFIG /etc/onion-service-discovery/node.json;
        fastcgi_pass unix:/run/php/onion-service-discovery.sock;
        fastcgi_read_timeout 65s;
    }
}
