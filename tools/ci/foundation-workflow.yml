name: Repository foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-12
        with:
          persist-credentials: false
      - name: Check source corpus and credential patterns
        run: python3 tools/check_repository.py
      - name: Test tamper and duplicate rejection
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
